name: Compilar APK Luxury Barber

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Compilar APK de prueba
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Luxury-Barber-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
